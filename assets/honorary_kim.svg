<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Kim O O 프로선수 캐릭터">
  <!-- 프로선수: 블랙 조끼와 나비넥타이, 세워 든 큐, 금메달, 날카로운 눈매 -->
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1f6a4c"/>
      <stop offset="1" stop-color="#062419"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d2ad"/>
      <stop offset="1" stop-color="#d8a97e"/>
    </linearGradient>
    <linearGradient id="cue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcc0"/>
      <stop offset="0.45" stop-color="#c79a5a"/>
      <stop offset="1" stop-color="#4a2a14"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="100" cy="92" r="64" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- 세워 든 큐 (오른쪽) -->
    <rect x="148" y="14" width="6" height="190" rx="3" fill="url(#cue)" stroke="#2b1a0c" stroke-width="0.8"/>
    <rect x="148" y="12" width="6" height="5" rx="1.5" fill="#3a6fb0"/>
    <!-- 흰 셔츠 어깨 -->
    <path d="M20 200 C24 166 50 150 100 146 C150 150 176 166 180 200 Z" fill="#f2f2f0" stroke="#9aa0a8" stroke-width="1.2"/>
    <!-- 블랙 조끼 -->
    <path d="M52 200 C54 172 66 156 86 150 L100 182 L114 150 C134 156 146 172 148 200 Z" fill="#141418" stroke="#000" stroke-width="1.2"/>
    <path d="M86 150 L100 182 L114 150" fill="none" stroke="#2c2c34" stroke-width="2"/>
    <circle cx="100" cy="190" r="2" fill="#c9a640"/>
    <!-- 나비넥타이 -->
    <path d="M100 151 L86 144 L86 158 Z" fill="#111" stroke="#000" stroke-width="0.8"/>
    <path d="M100 151 L114 144 L114 158 Z" fill="#111" stroke="#000" stroke-width="0.8"/>
    <rect x="96.5" y="147.5" width="7" height="7" rx="1.5" fill="#26262c"/>
    <!-- 금메달 리본 -->
    <path d="M90 156 L100 176 L110 156" fill="none" stroke="#b22234" stroke-width="5"/>
    <circle cx="100" cy="182" r="8.5" fill="#d4af37" stroke="#8a6d16" stroke-width="1.4"/>
    <path d="M100 177 L101.8 181 L106 181.3 L102.8 184 L103.8 188 L100 185.8 L96.2 188 L97.2 184 L94 181.3 L98.2 181 Z" fill="#fff3c4"/>
    <!-- 큐를 쥔 손 -->
    <path d="M140 150 C140 142 158 142 160 150 C162 158 142 160 140 150 Z" fill="#e2b991" stroke="#5a3e2b" stroke-width="1.2"/>
    <!-- 목 -->
    <path d="M89 122 L89 144 L111 144 L111 122 Z" fill="#d8a97e"/>
    <!-- 얼굴 (갸름한 턱) -->
    <path d="M71 88 C71 120 86 138 100 138 C114 138 129 120 129 88 C129 66 116 56 100 56 C84 56 71 66 71 88 Z" fill="url(#skin)" stroke="#5a3e2b" stroke-width="1.5"/>
    <path d="M71 92 C65 90 64 104 71 108" fill="#e2b991" stroke="#5a3e2b" stroke-width="1.3"/>
    <path d="M129 92 C135 90 136 104 129 108" fill="#e2b991" stroke="#5a3e2b" stroke-width="1.3"/>
    <!-- 단정한 흑발 (옆가르마) -->
    <path d="M69 90 C64 58 84 46 102 46 C124 46 138 60 131 90 C129 76 124 68 116 64 C104 70 88 68 78 66 C73 72 70 80 69 90 Z" fill="#141418" stroke="#000" stroke-width="1.2"/>
    <path d="M86 52 Q104 48 122 58" stroke="#3a3a44" stroke-width="1.3" fill="none"/>
    <!-- 눈썹 (각진, 집중) -->
    <path d="M78 86 L90 83 L96 85" stroke="#141418" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 85 L110 83 L122 86" stroke="#141418" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 날카로운 눈 -->
    <path d="M80 95 Q87 91 94 95 Q87 97 80 95 Z" fill="#ffffff" stroke="#1b120c" stroke-width="1.4"/>
    <path d="M106 95 Q113 91 120 95 Q113 97 106 95 Z" fill="#ffffff" stroke="#1b120c" stroke-width="1.4"/>
    <circle cx="87" cy="94.6" r="2" fill="#1b120c"/>
    <circle cx="113" cy="94.6" r="2" fill="#1b120c"/>
    <!-- 코 -->
    <path d="M100 98 L97 112 Q100 114 104 112" stroke="#9a6a48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 자신감 있는 입 -->
    <path d="M91 123 Q101 126 110 121" stroke="#6e3428" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="98" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="3"/>
  </g>
</svg>
