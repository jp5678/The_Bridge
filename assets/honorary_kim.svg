<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="김OO 프로선수 캐릭터">
  <!-- 프로선수: 경기복 조끼와 나비넥타이, 어깨에 걸친 큐 -->
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="#f3ede1"/>
    <circle cx="100" cy="100" r="78" fill="#d9e4d6"/>
    <!-- 큐 (어깨 뒤로) -->
    <path d="M150 20 L60 196" stroke="#8b5a2b" stroke-width="7" stroke-linecap="round"/>
    <path d="M150 20 L138 44" stroke="#f1e6cf" stroke-width="7" stroke-linecap="round"/>
    <path d="M151 18 L149 22" stroke="#3a6fb0" stroke-width="7" stroke-linecap="round"/>
    <!-- 셔츠 소매 -->
    <path d="M30 200 C34 160 58 146 100 144 C142 146 166 160 170 200 Z" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
    <!-- 조끼 -->
    <path d="M58 200 C60 168 72 152 88 148 L100 176 L112 148 C128 152 140 168 142 200 Z" fill="#1f1f24" stroke="#000" stroke-width="1.5"/>
    <circle cx="100" cy="184" r="2.2" fill="#d4af37"/>
    <circle cx="100" cy="195" r="2.2" fill="#d4af37"/>
    <!-- 나비넥타이 -->
    <path d="M100 152 L88 145 L88 159 Z M100 152 L112 145 L112 159 Z" fill="#1f1f24" stroke="#000" stroke-width="1"/>
    <circle cx="100" cy="152" r="3" fill="#3a3a44"/>
    <!-- 목 -->
    <rect x="91" y="124" width="18" height="22" rx="6" fill="#efc59c"/>
    <!-- 얼굴 -->
    <ellipse cx="100" cy="98" rx="30" ry="35" fill="#f6d4ae" stroke="#3b2b20" stroke-width="2"/>
    <ellipse cx="70" cy="100" rx="5" ry="8" fill="#efc59c" stroke="#3b2b20" stroke-width="1.5"/>
    <ellipse cx="130" cy="100" rx="5" ry="8" fill="#efc59c" stroke="#3b2b20" stroke-width="1.5"/>
    <!-- 짧은 흑발 -->
    <path d="M68 96 C62 62 84 52 102 54 C124 54 140 68 132 96 C130 82 122 74 112 72 C112 78 104 80 96 76 C86 78 74 82 68 96 Z" fill="#1c1c22" stroke="#000" stroke-width="1.5"/>
    <!-- 눈썹 (집중) -->
    <path d="M80 88 L95 86 M105 86 L120 88" stroke="#1c1c22" stroke-width="3" stroke-linecap="round"/>
    <!-- 눈 -->
    <ellipse cx="88" cy="97" rx="3" ry="2.6" fill="#1c1c22"/>
    <ellipse cx="112" cy="97" rx="3" ry="2.6" fill="#1c1c22"/>
    <!-- 코, 입 (자신감 있는 미소) -->
    <path d="M100 101 Q97 109 101 111" stroke="#8a5a3c" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M90 118 Q102 124 112 116" stroke="#7a3b2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- 오른손 (큐를 잡은 손) -->
    <ellipse cx="128" cy="148" rx="9" ry="8" fill="#f6d4ae" stroke="#3b2b20" stroke-width="1.5"/>
  </g>
</svg>
