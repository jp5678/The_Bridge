<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Yoon O O 우리당구클럽(광주) 사장 캐릭터">
  <!-- 당구클럽 사장: 네이비 더블 브레스트 재킷과 금단추, 넥타이, 희끗한 머리, 여유 있는 미소 -->
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#6b2a2a"/>
      <stop offset="1" stop-color="#220b0b"/>
    </radialGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22345c"/>
      <stop offset="1" stop-color="#0f1a33"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efc9a2"/>
      <stop offset="1" stop-color="#d3a178"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="100" cy="92" r="64" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- 더블 브레스트 재킷 -->
    <path d="M16 200 C20 164 48 148 100 144 C152 148 180 164 184 200 Z" fill="url(#jacket)" stroke="#070d1c" stroke-width="1.5"/>
    <!-- 셔츠와 넥타이 -->
    <path d="M86 144 L100 170 L114 144 L110 138 L90 138 Z" fill="#eef2f7" stroke="#9aa6b8" stroke-width="1"/>
    <path d="M96 148 L104 148 L106 154 L104 158 L106 182 L100 186 L94 182 L96 158 L94 154 Z" fill="#c4a040" stroke="#7a6220" stroke-width="1"/>
    <path d="M95 162 L105 168 M95 172 L105 178" stroke="#7a6220" stroke-width="1"/>
    <!-- 넓은 라펠 -->
    <path d="M86 144 L104 196 L64 162 L74 148 Z" fill="#1a2b4f" stroke="#070d1c" stroke-width="1"/>
    <path d="M114 144 L110 166 L136 162 L126 148 Z" fill="#1a2b4f" stroke="#070d1c" stroke-width="1"/>
    <!-- 금단추 (더블) -->
    <circle cx="116" cy="178" r="3" fill="#d4af37" stroke="#8a6d16" stroke-width="0.8"/>
    <circle cx="132" cy="178" r="3" fill="#d4af37" stroke="#8a6d16" stroke-width="0.8"/>
    <circle cx="116" cy="193" r="3" fill="#d4af37" stroke="#8a6d16" stroke-width="0.8"/>
    <circle cx="132" cy="193" r="3" fill="#d4af37" stroke="#8a6d16" stroke-width="0.8"/>
    <!-- 클럽 엠블럼 (가슴) -->
    <circle cx="66" cy="176" r="6" fill="#0f1a33" stroke="#d4af37" stroke-width="1.6"/>
    <circle cx="66" cy="176" r="2.2" fill="#c8262c"/>
    <!-- 목 -->
    <path d="M88 120 L88 142 L112 142 L112 120 Z" fill="#d3a178"/>
    <!-- 얼굴 (넉넉한 턱선) -->
    <path d="M69 88 C69 122 84 137 100 137 C116 137 131 122 131 88 C131 66 117 55 100 55 C83 55 69 66 69 88 Z" fill="url(#skin)" stroke="#5a3e2b" stroke-width="1.5"/>
    <path d="M69 92 C63 90 62 104 69 108" fill="#dfb38a" stroke="#5a3e2b" stroke-width="1.3"/>
    <path d="M131 92 C137 90 138 104 131 108" fill="#dfb38a" stroke="#5a3e2b" stroke-width="1.3"/>
    <!-- 희끗한 머리 (뒤로 넘김) -->
    <path d="M67 90 C62 58 84 44 102 44 C124 44 140 58 133 90 C131 76 126 68 118 64 C106 58 92 58 80 64 C74 70 69 78 67 90 Z" fill="#4a4442" stroke="#221e1c" stroke-width="1.4"/>
    <path d="M70 84 C70 74 74 68 78 66 M130 84 C130 74 126 68 122 66" stroke="#b9b4ae" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M84 54 Q102 48 120 56" stroke="#8d8680" stroke-width="1.4" fill="none"/>
    <!-- 눈썹 -->
    <path d="M78 85 Q87 81 95 84" stroke="#2e2826" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M105 84 Q113 81 122 85" stroke="#2e2826" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- 눈 (온화하지만 단단한) -->
    <path d="M80 95 Q87 91 94 95" stroke="#1f150e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M106 95 Q113 91 120 95" stroke="#1f150e" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="87" cy="95" r="1.9" fill="#1f150e"/>
    <circle cx="113" cy="95" r="1.9" fill="#1f150e"/>
    <path d="M80 99 Q84 101 88 100 M112 100 Q116 101 120 99" stroke="#b98c68" stroke-width="1" fill="none"/>
    <!-- 코 -->
    <path d="M100 98 L96 113 Q100 115 105 113" stroke="#9a6a48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 콧수염 -->
    <path d="M88 119 Q94 115 100 118 Q106 115 112 119 Q106 121 100 120 Q94 121 88 119 Z" fill="#4a4442"/>
    <!-- 여유 있는 미소 -->
    <path d="M90 125 Q100 131 110 125" stroke="#6e3428" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="98" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="3"/>
  </g>
</svg>
