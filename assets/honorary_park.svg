<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="박OO 광주광역시당구연맹 부회장 캐릭터">
  <!-- 연맹 부회장: 은발 올백, 금테 안경, 차콜 스리피스 정장, 버건디 넥타이와 금 타이핀, 연맹 배지 -->
  <defs>
    <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2c4470"/>
      <stop offset="1" stop-color="#0b1730"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4a"/>
      <stop offset="1" stop-color="#1e2229"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d0ae"/>
      <stop offset="1" stop-color="#d9ac85"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="200" height="200" fill="url(#bg)"/>
    <circle cx="100" cy="92" r="64" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- 어깨와 정장 -->
    <path d="M18 200 C22 166 48 150 100 146 C152 150 178 166 182 200 Z" fill="url(#suit)" stroke="#111" stroke-width="1.5"/>
    <!-- 조끼 -->
    <path d="M80 150 L100 196 L120 150 L128 200 L72 200 Z" fill="#2a2e36"/>
    <!-- 셔츠 -->
    <path d="M86 146 L100 172 L114 146 L110 140 L90 140 Z" fill="#f4f4f2" stroke="#9aa0a8" stroke-width="1"/>
    <!-- 넥타이 -->
    <path d="M96 150 L104 150 L106 156 L104 160 L108 196 L100 200 L92 196 L96 160 L94 156 Z" fill="#7d1f2a" stroke="#4a0f17" stroke-width="1"/>
    <rect x="93" y="172" width="14" height="2.6" rx="1" fill="#d4af37"/>
    <!-- 라펠 -->
    <path d="M86 146 L98 190 L68 160 L76 150 Z" fill="#30343d" stroke="#111" stroke-width="1"/>
    <path d="M114 146 L102 190 L132 160 L124 150 Z" fill="#30343d" stroke="#111" stroke-width="1"/>
    <!-- 포켓치프 -->
    <path d="M136 172 L142 166 L146 172 L150 167 L152 174 Z" fill="#f4f4f2"/>
    <!-- 연맹 배지 -->
    <circle cx="74" cy="168" r="4.5" fill="#d4af37" stroke="#8a6d16" stroke-width="1"/>
    <!-- 목 -->
    <path d="M88 122 L88 144 L112 144 L112 122 Z" fill="#d9ac85"/>
    <!-- 얼굴 -->
    <path d="M70 90 C70 122 84 138 100 138 C116 138 130 122 130 90 C130 66 116 56 100 56 C84 56 70 66 70 90 Z" fill="url(#skin)" stroke="#5a3e2b" stroke-width="1.5"/>
    <!-- 귀 -->
    <path d="M70 92 C64 90 63 104 70 108" fill="#e2b991" stroke="#5a3e2b" stroke-width="1.3"/>
    <path d="M130 92 C136 90 137 104 130 108" fill="#e2b991" stroke="#5a3e2b" stroke-width="1.3"/>
    <!-- 은발 올백 -->
    <path d="M68 92 C64 58 84 44 102 44 C122 44 138 58 132 92 C130 78 126 70 120 66 C108 60 92 60 80 66 C74 70 70 78 68 92 Z" fill="#cfd2d8" stroke="#7d828c" stroke-width="1.5"/>
    <path d="M82 58 Q100 50 120 58 M78 66 Q100 56 124 66" stroke="#9ea3ad" stroke-width="1.2" fill="none"/>
    <!-- 눈썹 (진하고 곧게) -->
    <path d="M78 86 L95 84" stroke="#7d828c" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M105 84 L122 86" stroke="#7d828c" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 금테 안경 -->
    <rect x="77" y="90" width="19" height="13" rx="4" fill="#ffffff" fill-opacity="0.12" stroke="#b8932a" stroke-width="1.8"/>
    <rect x="104" y="90" width="19" height="13" rx="4" fill="#ffffff" fill-opacity="0.12" stroke="#b8932a" stroke-width="1.8"/>
    <path d="M96 95 L104 95" stroke="#b8932a" stroke-width="1.8"/>
    <!-- 눈 -->
    <path d="M81 97 Q87 94 92 97" stroke="#2a1c12" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M108 97 Q113 94 119 97" stroke="#2a1c12" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="86.5" cy="97" r="1.8" fill="#2a1c12"/>
    <circle cx="113.5" cy="97" r="1.8" fill="#2a1c12"/>
    <!-- 코 -->
    <path d="M100 100 L97 114 Q100 116 104 114" stroke="#9a6a48" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 팔자 주름 -->
    <path d="M88 114 Q85 120 88 126 M112 114 Q115 120 112 126" stroke="#b98c68" stroke-width="1.1" fill="none"/>
    <!-- 다문 입 (절제된 미소) -->
    <path d="M91 124 Q100 128 109 124" stroke="#6e3428" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 금빛 테두리 광 -->
    <circle cx="100" cy="100" r="98" fill="none" stroke="#d4af37" stroke-opacity="0.35" stroke-width="3"/>
  </g>
</svg>
